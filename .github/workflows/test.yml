name: Test

on: [push]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      D3_API_KEY_MAINNET: ${{ secrets.D3_API_KEY_MAINNET }}
      UNSTOPPABLE_DOMAINS_API_KEY: ${{ secrets.UNSTOPPABLE_DOMAINS_API_KEY }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Setup Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: '7'

      - name: Yarn install
        run: yarn install --frozen-lockfile

      - name: Restore Jest cache
        uses: actions/cache@v6
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('yarn.lock', 'jest.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jest-${{ runner.os }}-${{ hashFiles('yarn.lock', 'jest.config.ts') }}-

      - name: Test
        run: yarn test:coverage --cacheDirectory .jest-cache --json --outputFile /tmp/jest.json

      - name: Measure (temporary)
        if: always()
        run: node -e 'const r=require("/tmp/jest.json");const t0=Math.min(...r.testResults.map(x=>x.startTime));r.testResults.map(x=>[x.startTime-t0,x.endTime-t0,x.name.replace(process.cwd()+"/","")]).sort((a,b)=>a[0]-b[0]).forEach((x,i)=>console.log("MEAS",i,(x[0]/1e3).toFixed(1),(x[1]/1e3).toFixed(1),((x[1]-x[0])/1e3).toFixed(1),x[2]))'

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
