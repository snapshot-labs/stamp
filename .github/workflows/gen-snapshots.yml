name: Gen Snapshots (temp)

on:
  push:
    branches:
      - test/resolver-image-snapshots

jobs:
  gen-snapshots:
    name: Generate resolver image snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup Redis
        uses: supercharge/redis-github-action@1.7.0
        with:
          redis-version: '7'

      - name: Yarn install
        run: yarn install --frozen-lockfile

      - name: Probe secret presence
        run: |
          echo "COINGECKO_API_KEY set: ${{ secrets.COINGECKO_API_KEY != '' }}"
          echo "NEYNAR_API_KEY set: ${{ secrets.NEYNAR_API_KEY != '' }}"

      - name: Update resolver image snapshots
        run: yarn jest test/integration/resolvers/coingecko.test.ts test/integration/resolvers/farcaster.test.ts --updateSnapshot --runInBand

      - name: Upload generated snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-snapshots
          path: test/integration/resolvers/__image_snapshots__/*.png
          if-no-files-found: error
